function registerLoyalty(ph,sum,signature){

function parseCoords(v){const m=String(v||'').match(/(-?\d{1,2}(?:\.\d+)?)\s*[,،]\s*(-?\d{1,3}(?:\.\d+)?)/);if(!m)return null;const lat=Number(m[1]),lon=Number(m[2]);return Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=90&&Math.abs(lon)<=180?{lat,lon}:null}

     '╭──── '+(lang==='ar'?'الملخص المالي':'TOTALS')+' ────╮',
     `│ ${tr('subtotal')}: *${clearMoney(secure.subtotal)}* ${lang==='ar'?'ريال عماني':'OMR'}`,
     `│ ${tr('deliveryFee')}: ${secure.deliveryFee==null?(lang==='ar'?'يحدد بعد التأكيد':'Confirm first'):(secure.deliveryFee===0?(lang==='ar'?'🎁 مجاني':'🎁 Free'):`*${clearMoney(secure.deliveryFee)}* ${lang==='ar'?'ريال عماني':'OMR'}`)}`,
     `│ ${tr('grand')}: *${clearMoney(secure.total)}* ${lang==='ar'?'ريال عماني':'OMR'}`,
     '╰──────────────────╯',
     '',
     `🚚 ${lang==='ar'?'نوع الطلب':'Order type'}: ${secure.orderType==='delivery'?(lang==='ar'?'توصيل':'Delivery'):(lang==='ar'?'استلام':'Pickup')}`,
     `💳 ${lang==='ar'?'طريقة الدفع':'Payment'}: ${secure.paymentLabel}`,
     `👤 ${lang==='ar'?'الاسم':'Name'}: ${secure.name||'-'}`,
     '',
     '── '+(lang==='ar'?'بيانات الوصول المباشر':'DIRECT CONTACT')+' ──',
     `📱 ${lang==='ar'?'رقم العميل':'Customer phone'}: ${ltr(secure.phone)}`
   );

   if(secure.distanceKm!=null){
     lines.push(`📏 ${lang==='ar'?'المسافة':'Distance'}: ${ltr(secure.distanceKm.toFixed(1))} km`);
   }
   if(secure.locationUrl) lines.push(`📍 ${lang==='ar'?'موقع العميل':'Customer location'}: ${secure.locationUrl}`);
   if(secure.generalNote) lines.push(`${lang==='ar'?'ملاحظة':'Note'}: ${secure.generalNote}`);
   if(secure.replacement) lines.push(`${lang==='ar'?'البديل':'Replacement'}: ${secure.replacement}`);
   if(pay==='transfer') lines.push(lang==='ar'?'يرجى إرسال صورة إيصال التحويل في واتساب.':'Please send the transfer receipt image in WhatsApp.');

   lines.push(
     '',
     '🟥🟨🟩 '+seal,
     lang==='ar'
       ?'🔐 *للمطعم:* الزخرفة والختم يساعدان على اكتشاف التغيير بصريًا، لكن المرجع الأمني الحقيقي هو الطلب المحفوظ داخل رابط التحقق أعلاه.'
       :'🔐 *Restaurant:* The decoration and seal help spot edits visually, but the true security reference is the stored order in the verification link above.'
   );

   const signature=secure.shortId;
   const loy=registerLoyalty(ph,sum,signature);
   if(loy&&loy.gained>0) lines.push(`${lang==='ar'?'⭐ نقاط هذا الطلب':'⭐ Points earned'}: +${loy.gained}`);
   if(discount) redeemIfSelected(ph);

   localStorage.setItem('tg_owner_orders',String(Number(localStorage.getItem('tg_owner_orders')||0)+1));
   localStorage.setItem('tg_owner_sales',String(Number(localStorage.getItem('tg_owner_sales')||0)+secure.total));

   showLoyalty(ph);
   toast(lang==='ar'?'تم تثبيت الطلب 🔒 فتح واتساب...':'Order secured 🔒 Opening WhatsApp...');
   openWhatsAppDirect(lines.join('\n'));
 }catch(e){
   toast((lang==='ar'?'لم يتم إرسال الطلب: ':'Order not sent: ')+(e.message||'خطأ'));
 }finally{
   setTimeout(()=>{
     sendBtn.disabled=false;
     sendBtn.textContent=originalText;
   },1500);
 }
}

function openWhatsAppDirect(message){
 const encoded=encodeURIComponent(message);
 const appUrl=`whatsapp://send?phone=${WA}&text=${encoded}`;
 const webUrl=`https://wa.me/${WA}?text=${encoded}`;
 let moved=false;
 const onVis=()=>{if(document.hidden)moved=true};
 document.addEventListener('visibilitychange',onVis,{once:true});
 window.location.href=appUrl;
 setTimeout(()=>{
   if(!moved && document.visibilityState==='visible'){
     window.location.href=webUrl;
   }
 },1800);
}

 closeCart();
 toast(lang==='ar'?'تم تفريغ السلة':'Cart cleared');
}

$('copyTransfer').onclick=()=>copyText('96205536').then(()=>toast(lang==='ar'?'تم نسخ رقم التحويل':'Transfer number copied'));

let visitCountForOwner=null;
async function trackVisit(){
 try{
   const base='https://api.counterapi.dev/v1/turkish-garden-samail-v6/visits';
   if(!sessionStorage.getItem('tg_visit_v6')){
     const r=await fetch(base+'/up',{cache:'no-store'});const d=await r.json();
     if(Number.isFinite(Number(d.count)))visitCountForOwner=Number(d.count);
     sessionStorage.setItem('tg_visit_v6','1');
   }else{
     const r=await fetch(base,{cache:'no-store'});const d=await r.json();
     if(Number.isFinite(Number(d.count)))visitCountForOwner=Number(d.count);
   }
 }catch(e){}
 return visitCountForOwner;
}


let CURRENT_OFFER=null;
async function loadOffer(){
  try{
    const r=await fetch('/api/offer',{cache:'no-store'});
    if(!r.ok) throw new Error('offer api');
    const d=await r.json();
    CURRENT_OFFER=d&&d.offer?d.offer:null;
  }catch(e){ CURRENT_OFFER=null; }
  renderOffer();
  fillOwnerOfferForm();
}
function offerIsLive(o){
  if(!o || !o.active) return false;
  if(o.expiry){
    const end=new Date(o.expiry+'T23:59:59');
    if(Number.isFinite(end.getTime()) && Date.now()>end.getTime()) return false;
  }
  return !!(o.title||o.text);
}
function renderOffer(){
  const live=offerIsLive(CURRENT_OFFER);
  $('liveOffer').classList.toggle('hidden',!live);
  if(!live){
    $('offersTitle').textContent=lang==='ar'?'انتظرونا قريبًا للعروض المميزة ✨':'Special offers are coming soon ✨';
    $('offersDesc').textContent=lang==='ar'?'نعمل على تجهيز عروض تليق بكم. ترقبوا مفاجآت الحديقة التركية القادمة.':'We are preparing special offers for you. Stay tuned for Turkish Garden surprises.';
    return;
  }
  $('offersTitle').textContent=lang==='ar'?'عرضنا الحالي':'Current offer';
  $('offersDesc').textContent=lang==='ar'?'لفترة محدودة حسب توفر الأصناف.':'For a limited time, subject to item availability.';
  $('liveOfferTitle').textContent=CURRENT_OFFER.title||'';
  $('liveOfferText').textContent=CURRENT_OFFER.text||'';
  $('liveOfferPrice').textContent=CURRENT_OFFER.price?Number(CURRENT_OFFER.price).toFixed(3)+' '+(lang==='ar'?'ر.ع':'OMR'):'';
  $('liveOfferExpiry').textContent=CURRENT_OFFER.expiry?(lang==='ar'?'حتى '+CURRENT_OFFER.expiry:'Until '+CURRENT_OFFER.expiry):'';
}
function fillOwnerOfferForm(){
  if(!$('ownerPanel').classList.contains('show')) return;
  const o=CURRENT_OFFER||{};
  $('ownerOfferTitle').value=o.title||'';
  $('ownerOfferText').value=o.text||'';
  $('ownerOfferPrice').value=o.price||'';
  $('ownerOfferExpiry').value=o.expiry||'';
  $('ownerOfferActive').checked=!!o.active;
}
async function ownerOfferRequest(method,body){
  const key=new URLSearchParams(location.search).get('owner')||'';
  const r=await fetch('/api/offer',{
    method,
    headers:{'Content-Type':'application/json','X-Owner-Key':key},
    body:body?JSON.stringify(body):undefined
  });
  let data={}; try{data=await r.json()}catch(e){}
  if(!r.ok) throw new Error(data.error||'تعذر حفظ العرض');
  return data;
}
async function saveOwnerOffer(){
  $('ownerOfferStatus').textContent='جارٍ الحفظ...';
  const o={
    title:$('ownerOfferTitle').value.trim(),
    text:$('ownerOfferText').value.trim(),
    price:$('ownerOfferPrice').value.trim(),
    expiry:$('ownerOfferExpiry').value,
    active:$('ownerOfferActive').checked
  };
  try{
    await ownerOfferRequest('PUT',o);
    CURRENT_OFFER=o;
    renderOffer();
    $('ownerOfferStatus').textContent=o.active?'تم حفظ ونشر العرض للزبائن ✅':'تم الحفظ، لكن العرض غير مفعّل.';
  }catch(e){$('ownerOfferStatus').textContent='تعذر الحفظ: '+e.message}
}
async function removeOwnerOffer(){
  if(!confirm('إزالة العرض الحالي وإظهار عبارة انتظرونا قريبًا؟'))return;
  $('ownerOfferStatus').textContent='جارٍ الإزالة...';
  try{
    await ownerOfferRequest('DELETE');
    CURRENT_OFFER=null;
    renderOffer();fillOwnerOfferForm();
    $('ownerOfferStatus').textContent='تمت إزالة العرض. تظهر الآن رسالة انتظرونا قريبًا ✅';
  }catch(e){$('ownerOfferStatus').textContent='تعذر الإزالة: '+e.message}
}
$('saveOfferBtn').onclick=saveOwnerOffer;
$('removeOfferBtn').onclick=removeOwnerOffer;
$('offerOrderBtn').onclick=()=>{
  if(!offerIsLive(CURRENT_OFFER))return;
  const txt=`${CURRENT_OFFER.title||'عرض الحديقة التركية'}${CURRENT_OFFER.price?` — ${Number(CURRENT_OFFER.price).toFixed(3)} ر.ع`:''}`;
  $('search').value=txt;
  toast(lang==='ar'?'يمكنك طلب العرض عبر واتساب من أسفل الصفحة':'You can request the offer via WhatsApp');
};


async function loadSecureOrders(){
 if(!$('ownerPanel').classList.contains('show'))return;
 const key=new URLSearchParams(location.search).get('owner')||'';
 $('secureOrdersList').textContent='جارٍ تحميل الطلبات...';
 try{
   const r=await fetch('/api/orders',{headers:{'X-Owner-Key':key},cache:'no-store'});
   const d=await r.json();
   if(!r.ok)throw new Error(d.error||'تعذر التحميل');
   if(!d.orders.length){
     $('secureOrdersList').textContent='لا توجد طلبات مثبتة حتى الآن.';
     return;
   }
   $('secureOrdersList').innerHTML=d.orders.map(o=>`
     <div class="secureOrderRow">
       <div class="top"><b>${o.shortId}</b><strong>${Number(o.total).toFixed(3)} ر.ع</strong></div>
       <small>${o.name||'-'} • ${o.phone||'-'} • ${new Date(o.createdAt).toLocaleString('ar-OM')}</small>
       <a href="${o.verifyUrl}" target="_blank">فتح الطلب المعتمد</a>
     </div>`).join('');
 }catch(e){
   $('secureOrdersList').textContent='تعذر تحميل الطلبات المثبتة.';
 }
}
$('refreshSecureOrders').onclick=loadSecureOrders;

async function ownerPanel(){
 const isOwner=new URLSearchParams(location.search).get('owner')===OWNER_KEY;
 const count=await trackVisit();
 if(!isOwner)return;
 $('ownerPanel').classList.add('show');
 const orders=Number(localStorage.getItem('tg_owner_orders')||0);
 const sales=Number(localStorage.getItem('tg_owner_sales')||0);
 loadSecureOrders();
 $('ownerStats').innerHTML=`زوار الموقع: <b>${count==null?'غير متاح':count.toLocaleString('ar')}</b><br>طلبات أُرسلت من هذا الجهاز: <b>${orders}</b><br>قيمة الطلبات المسجلة على هذا الجهاز: <b>${sales.toFixed(3)} ر.ع</b>`;
}

setTimeout(()=>$('intro').classList.add('leaving'),1800);setTimeout(()=>$('intro').classList.add('done'),3000);
applyLang();showLoyalty('');renderCart();ownerPanel();loadOffer();gotoStep(1);
</script>
